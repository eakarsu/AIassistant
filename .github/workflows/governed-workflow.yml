name: Governed workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test backend/governance/*.test.cjs
      - run: find backend/governance -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check backend/server.js && node --check backend/middleware/auth.js && node --check backend/routes/auth.js
      - run: bash -n start.sh
      - run: '! grep -E "kill[[:space:]]+-9|pkill|dropdb|createdb|npm[[:space:]]+install|seed\.js|psql.*-f" start.sh'
      - run: grep -q governed_outbox backend/migrations/001_governed_cited_answer.sql && ! grep -E 'DROP TABLE|TRUNCATE' backend/migrations/001_governed_cited_answer.sql
